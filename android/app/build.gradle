plugins { id "com.android.application" }

def host = project.property("steadierHost")
def keyProps = new Properties()
def keyFile = file(System.getenv("STEADIER_KEYSTORE_PROPERTIES") ?: "/keys/keystore.properties")
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace "com.geerusty.steadier"
    compileSdk 34

    defaultConfig {
        applicationId "com.geerusty.steadier"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [hostName: host]
        resValue "string", "launchUrl", "https://${host}/"
        resValue "string", "assetStatements",
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile file(keyProps["storeFile"])
                storePassword keyProps["storePassword"]
                keyAlias keyProps["keyAlias"]
                keyPassword keyProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
